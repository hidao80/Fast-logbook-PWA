<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf7d9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#62BF04"/>
      <stop offset="100%" stop-color="#8fd93a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative log-line pattern -->
  <g font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#62BF04" opacity="0.10">
    <text x="60" y="90">2026-09-12 09:00 Work;Start daily standup</text>
    <text x="60" y="130">2026-09-12 10:15 Break;Coffee</text>
    <text x="60" y="170">2026-09-12 10:30 Work;Review pull requests</text>
    <text x="60" y="530">2026-09-12 12:00 Work;Design social preview</text>
    <text x="60" y="570">2026-09-12 13:00 Work;Ship release</text>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="14" fill="url(#accent)"/>

  <!-- stopwatch emoji (Twemoji vector, viewBox 0 0 36 36) -->
  <g transform="translate(90,175) scale(7.5)">
    <path fill="#292F33" d="M16 5h4v3h-4z"/>
    <path fill="#8899A6" d="M22 1h-8c-1.1 0-2 .9-2 2s.9 2 2 2h8c1.1 0 2-.9 2-2s-.9-2-2-2zm6.184 10.507l-1.504-1.318c-.827-.725-.911-1.995-.186-2.822.725-.827 1.995-.911 2.822-.186l1.504 1.318c.827.725.911 1.995.186 2.822-.725.827-1.995.911-2.822.186z"/>
    <circle fill="#F5F8FA" cx="18" cy="21" r="11"/>
    <path fill="#66757F" d="M18 7C10.268 7 4 13.268 4 21s6.268 14 14 14 14-6.268 14-14S25.732 7 18 7zm0 25c-6.065 0-11-4.935-11-11s4.935-11 11-11 11 4.935 11 11-4.935 11-11 11z"/>
    <path fill="#292F33" d="M27 22H17c-.552 0-1-.447-1-1s.448-1 1-1h10c.553 0 1 .447 1 1s-.447 1-1 1z"/>
    <circle fill="#292F33" cx="18" cy="12" r="1"/>
    <circle fill="#292F33" cx="18" cy="30" r="1"/>
    <circle fill="#292F33" cx="12" cy="15" r="1"/>
    <circle fill="#292F33" cx="24" cy="27" r="1"/>
    <circle fill="#292F33" cx="9" cy="21" r="1"/>
    <circle fill="#292F33" cx="24" cy="15" r="1"/>
    <path fill="#DD2E44" d="M12 28c-.256 0-.512-.098-.707-.293-.391-.391-.391-1.023 0-1.414l7-7c.391-.391 1.023-.391 1.414 0s.391 1.023 0 1.414l-7 7c-.195.195-.451.293-.707.293z"/>
  </g>

  <!-- notebook emoji accent, smaller, bottom-right of stopwatch -->
  <g transform="translate(330,330) scale(2.6)">
    <path fill="#292F33" d="M35 26c0 2.209-1.791 4-4 4H5c-2.209 0-4-1.791-4-4V6.313C1 4.104 6.791 0 9 0h20.625C32.719 0 35 2.312 35 5.375V26z"/>
    <path fill="#CCD6DD" d="M33 30c0 2.209-1.791 4-4 4H7c-2.209 0-4-1.791-4-4V6c0-4.119-.021-4 5-4h21c2.209 0 4 1.791 4 4v24z"/>
    <path fill="#E1E8ED" d="M31 31c0 1.657-1.343 3-3 3H4c-1.657 0-3-1.343-3-3V7c0-1.657 1.343-3 3-3h24c1.657 0 3 1.343 3 3v24z"/>
    <path fill="#292F33" d="M31 32c0 2.209-1.791 4-4 4H6c-2.209 0-4-1.791-4-4V10c0-2.209 1.791-4 4-4h21c2.209 0 4 1.791 4 4v22z"/>
    <path fill="#66757F" d="M29 32c0 2.209-1.791 4-4 4H6c-2.209 0-4-1.791-4-4V12c0-2.209 1.791-4 4-4h19.335C27.544 8 29 9.456 29 11.665V32z"/>
    <path fill="#292F33" d="M6 6C4.312 6 4.269 4.078 5 3.25 5.832 2.309 7.125 2 9.438 2H11V0H8.281C4.312 0 1 2.5 1 5.375V32c0 2.209 1.791 4 4 4h2V6H6z"/>
    <path d="M7 8h3v4H7zm7 0h4v4h-4zm12 .056c-.214-.031-.433-.056-.665-.056H22v4h4V8.056zM18 12h4v4h-4zm8 0h3v4h-3zm-16 0h4v4h-4zm-3 4h3v4H7zm7 0h4v4h-4zm8 0h4v4h-4zm-4 4h4v4h-4zm8 0h3v4h-3zm-16 0h4v4h-4zm-3 4h3v4H7zm7 0h4v4h-4zm8 0h4v4h-4zM7 32h3v4H7zm7 0h4v4h-4zm8 4h3c.347 0 .679-.058 1-.141V32h-4v4zm-4-8h4v4h-4zm8 0h3v4h-3zm-16 0h4v4h-4z" fill="#CCD6DD"/>
  </g>

  <!-- title -->
  <text x="470" y="285" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#1a1a1a">Fast logbook PWA</text>

  <!-- subtitle -->
  <text x="472" y="345" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#3c3c3c">Time-stamped work notes PWA</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="480" y="380" width="140" height="46" rx="23" fill="#62BF04" opacity="0.15"/>
    <text x="504" y="410" fill="#3f7a00">No backend</text>

    <rect x="636" y="380" width="110" height="46" rx="23" fill="#62BF04" opacity="0.15"/>
    <text x="660" y="410" fill="#3f7a00">Offline</text>

    <rect x="762" y="380" width="120" height="46" rx="23" fill="#62BF04" opacity="0.15"/>
    <text x="786" y="410" fill="#3f7a00">Free / MIT</text>
  </g>

  <!-- footer -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5a5a5a">
    <text x="90" y="586">fast-logbook.netlify.app</text>
    <text x="1020" y="586" text-anchor="end">by hidao80</text>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="616" width="1200" height="14" fill="url(#accent)"/>
</svg>
